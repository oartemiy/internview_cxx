openapi: 3.0.0
info:
  title: InternView API
  version: 1.0.0
  description: |
    API for InternView platform – connecting interns and recruiters.

    Errors of JSON endpoints are returned as `ErrorResponse`.
    File endpoints (profile pictures and CV pdf) return errors with an empty body.
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.internview.com
    description: Production server

tags:
  - name: auth
    description: Authentication and sessions
  - name: users
    description: User profile operations
  - name: cvs
    description: CV (resume) operations
  - name: vacancies
    description: Vacancy operations
  - name: applications
    description: Application (response) operations
  - name: service
    description: Service health

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /auth/register, /auth/login or /auth/refresh. Lives 30 minutes.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Invalid uuid results in 400
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid input (malformed uuid, missing fields, validation error)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, malformed or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Wrong role or the resource belongs to somebody else
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Unique constraint violation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: HTTP status code
          example: "400"
        message:
          type: string
          description: HTTP status text
          example: Bad Request
        details:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error message
      required:
        - code
        - message

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [intern, recruiter]
        description:
          type: string
          nullable: true
        profile_pic:
          type: string
          nullable: true
          description: Storage key of the picture, download it via /users/me/profile-pic
        created_at:
          type: string
          format: date-time
      required: [id, login, name, role, description, profile_pic, created_at]

    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            access_token:
              type: string
              description: JWT access token
            refresh_token:
              type: string
              description: Opaque single-use refresh token (14 days)
          required: [access_token, refresh_token]

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
      required: [access_token, refresh_token]

    RegisterRequest:
      type: object
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 50
          description: '"me" is reserved'
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [intern, recruiter]
        description:
          type: string
          nullable: true
      required: [login, password, name, role]

    LoginRequest:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
          format: password
      required: [login, password]

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]

    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 6
          maxLength: 128
      required: [old_password, new_password]

    UserUpdateRequest:
      type: object
      description: Role can not be changed. At least one field must actually change.
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 50
          description: '"me" is reserved'
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
        profile_pic:
          type: string
          nullable: true
          enum: [null]
          description: Only null is accepted (removes the picture). Upload via POST /users/me/profile-pic
      minProperties: 1

    UserDeleteRequest:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
          format: password
      required: [login, password]

    CV:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        cv_pdf:
          type: string
          nullable: true
          description: Storage key of the pdf, download it via /cvs/{id}/pdf
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, user_id, title, description, cv_pdf, created_at, updated_at]

    CVCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Unique among CVs of the user
        description:
          type: string
          nullable: true
      required: [title]

    CVUpdateRequest:
      type: object
      description: At least one field must actually change
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
        cv_pdf:
          type: string
          nullable: true
          enum: [null]
          description: Only null is accepted (removes the pdf). Upload via POST /cvs/{id}/pdf
      minProperties: 1

    Vacancy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recruiter_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        requirements:
          type: array
          items:
            type: string
          nullable: true
        salary_range:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        work_mode:
          type: string
          enum: [remote, office, hybrid]
          nullable: true
        experience_level:
          type: string
          enum: [junior, middle, senior]
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        [id, recruiter_id, title, description, requirements, salary_range, location, work_mode,
         experience_level, is_active, created_at, updated_at]

    VacancyCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Unique among vacancies of the recruiter
        description:
          type: string
          nullable: true
        requirements:
          type: array
          items:
            type: string
          nullable: true
        salary_range:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        work_mode:
          type: string
          enum: [remote, office, hybrid]
          nullable: true
        experience_level:
          type: string
          enum: [junior, middle, senior]
          nullable: true
      required: [title]

    VacancyUpdateRequest:
      type: object
      description: |
        At least one field must actually change.
        Use PATCH /vacancies/{id}/toggle to change is_active.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
        requirements:
          type: array
          items:
            type: string
          nullable: true
        salary_range:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        work_mode:
          type: string
          enum: [remote, office, hybrid]
          nullable: true
        experience_level:
          type: string
          enum: [junior, middle, senior]
          nullable: true
      minProperties: 1

    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vacancy_id:
          type: string
          format: uuid
        intern_id:
          type: string
          format: uuid
        cv_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, reviewed, approved, rejected, cancelled]
        cover_letter:
          type: string
          nullable: true
        applied_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, vacancy_id, intern_id, cv_id, status, cover_letter, applied_at, updated_at]

    ApplicationCreateRequest:
      type: object
      properties:
        vacancy_id:
          type: string
          format: uuid
        cv_id:
          type: string
          format: uuid
          description: Must be a CV of the current intern
        cover_letter:
          type: string
          nullable: true
      required: [vacancy_id, cv_id]

    ApplicationInternUpdateRequest:
      type: object
      description: Intern (application owner) may change only cover_letter and/or cv_id
      properties:
        cv_id:
          type: string
          format: uuid
          description: Must be a CV of the current intern
        cover_letter:
          type: string
          nullable: true
      minProperties: 1
      additionalProperties: false

    ApplicationRecruiterUpdateRequest:
      type: object
      description: Recruiter (vacancy owner) may change only status
      properties:
        status:
          type: string
          enum: [pending, reviewed, approved, rejected, cancelled]
      required: [status]
      additionalProperties: false

    FileUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]

security:
  - bearerAuth: []

paths:
  /ping:
    get:
      summary: Liveness probe
      tags: [service]
      security: []
      responses:
        "200":
          description: Service is alive

  /status:
    get:
      summary: Service status
      tags: [service]
      security: []
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: InternView API
                  version:
                    type: string
                    example: 0.0.1

  # ------------------------------------------------------------------ auth

  /auth/register:
    post:
      summary: Register a new user
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      summary: Login with credentials
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid login or password (the same answer for both)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      summary: Exchange a refresh token for a new token pair
      description: Refresh tokens are single use, the old one is invalidated.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Refresh token is unknown, expired, revoked or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      summary: Revoke all refresh tokens of the current user
      description: Access tokens stay valid until they expire.
      tags: [auth]
      responses:
        "200":
          description: All sessions are finished
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/change-password:
    post:
      summary: Change password
      description: Revokes all refresh tokens and invalidates all issued access tokens.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Invalid old password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------ users

  /users/me:
    get:
      summary: Get current user profile
      tags: [users]
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Update current user profile (partial)
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Login already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete current user account
      description: Deletes CVs, vacancies and applications of the user as well.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDeleteRequest"
      responses:
        "204":
          description: Account deleted successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Invalid password, nothing is deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}:
    get:
      summary: Get user by ID
      description: Available for the user itself and for recruiters the user applied to.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: User data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/profile-pic:
    post:
      summary: Upload profile picture (.jpg, .jpeg, .png, up to 5 MiB)
      tags: [users]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUpload"
      responses:
        "200":
          description: Profile picture uploaded successfully
          content:
            text/plain:
              schema:
                type: string
                example: Uploaded
        "400":
          description: Missing file, empty file name or unsupported extension
        "401":
          description: Unauthorized

    get:
      summary: Get current user's profile picture
      tags: [users]
      responses:
        "200":
          description: Profile picture file
          content:
            image/jpeg: {}
            image/png: {}
        "401":
          description: Unauthorized
        "404":
          description: Profile picture not found

  /users/{id}/profile-pic:
    get:
      summary: Get profile picture of an applicant (recruiter only)
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Profile picture file
          content:
            image/jpeg: {}
            image/png: {}
        "400":
          description: Invalid uuid
        "401":
          description: Unauthorized
        "403":
          description: Not a recruiter or the user did not apply to your vacancies
        "404":
          description: Profile picture not found

  # ------------------------------------------------------------------ cvs

  /cvs:
    post:
      summary: Create a new CV (intern only)
      tags: [cvs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CVCreateRequest"
      responses:
        "201":
          description: CV created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CV"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Title already taken by another CV of the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cvs/me:
    get:
      summary: Get all CVs of the current user (intern only)
      tags: [cvs]
      responses:
        "200":
          description: List of user's CVs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CV"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /cvs/{id}:
    get:
      summary: Get a specific CV
      description: Available for the owner and for recruiters whose vacancy the CV was sent to.
      tags: [cvs]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: CV details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CV"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Recruiter and the CV was not sent to your vacancies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: CV not found or belongs to another intern
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      summary: Update a CV (owner only)
      tags: [cvs]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CVUpdateRequest"
      responses:
        "200":
          description: Updated CV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CV"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: CV not found or belongs to another intern
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Title already taken by another CV of the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete a CV (owner only)
      description: Deletes the pdf and all applications made with this CV.
      tags: [cvs]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: CV deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: CV not found or belongs to another intern
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cvs/{id}/pdf:
    post:
      summary: Upload PDF for a CV (owner only, .pdf)
      tags: [cvs]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUpload"
      responses:
        "200":
          description: PDF uploaded successfully
          content:
            text/plain:
              schema:
                type: string
                example: Uploaded
        "400":
          description: Invalid uuid, missing file or unsupported extension
        "401":
          description: Unauthorized
        "403":
          description: Not an intern
        "404":
          description: CV not found or belongs to another intern

    get:
      summary: Download PDF of a CV
      description: Available for the owner and for recruiters whose vacancy the CV was sent to.
      tags: [cvs]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: PDF file
          content:
            application/pdf: {}
        "400":
          description: Invalid uuid
        "401":
          description: Unauthorized
        "403":
          description: Recruiter and the CV was not sent to your vacancies
        "404":
          description: CV or its pdf not found

  # ------------------------------------------------------------------ vacancies

  /vacancies:
    post:
      summary: Create a new vacancy (recruiter only)
      tags: [vacancies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VacancyCreateRequest"
      responses:
        "201":
          description: Vacancy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Title already taken by another vacancy of the recruiter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: List active vacancies, newest first
      tags: [vacancies]
      security: []
      parameters:
        - name: query
          in: query
          schema:
            type: string
          description: Full-text search by title and description (russian and english)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of vacancies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vacancy"
        "400":
          $ref: "#/components/responses/BadRequest"

  /vacancies/me:
    get:
      summary: Get all vacancies of the current recruiter (including inactive)
      tags: [vacancies]
      responses:
        "200":
          description: List of recruiter's vacancies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vacancy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /vacancies/{id}:
    get:
      summary: Get a vacancy by ID
      tags: [vacancies]
      security: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Vacancy details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Update a vacancy (recruiter owner only)
      tags: [vacancies]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VacancyUpdateRequest"
      responses:
        "200":
          description: Updated vacancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Title already taken by another vacancy of the recruiter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete a vacancy (recruiter owner only)
      description: Deletes all applications to the vacancy as well.
      tags: [vacancies]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Vacancy deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /vacancies/{id}/toggle:
    patch:
      summary: Toggle vacancy is_active (recruiter owner only)
      tags: [vacancies]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated vacancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /vacancies/{id}/applications:
    get:
      summary: Get all applications for a vacancy (recruiter owner only)
      tags: [applications]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: List of applications for the vacancy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------ applications

  /applications:
    post:
      summary: Apply to a vacancy (intern only)
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreateRequest"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Vacancy not found, or CV not found / belongs to another intern
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already applied to this vacancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/me:
    get:
      summary: Applications of the current user
      description: For interns - own applications, for recruiters - applications to own vacancies.
      tags: [applications]
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /applications/{id}:
    patch:
      summary: Update an application
      description: |
        Intern (application owner) may change cover_letter and/or cv_id.
        Recruiter (vacancy owner) may change status only.
      tags: [applications]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ApplicationInternUpdateRequest"
                - $ref: "#/components/schemas/ApplicationRecruiterUpdateRequest"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid uuid, unsupported status or fields not allowed for your role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the application owner (intern) or not the vacancy owner (recruiter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found, or new CV not found / belongs to another intern
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Withdraw an application (intern owner only)
      tags: [applications]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Application withdrawn
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
